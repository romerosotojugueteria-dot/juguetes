<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayUp Store - ¡Sube la diversión!</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap');
    body { font-family: 'Fredoka', sans-serif; }
    
    .bg-magical {
      background: linear-gradient(-45deg, #0019ff, #d600ff, #ff007b, #ff7b00);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .stars {
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 50px 160px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 130px 80px, #ffffff, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    .bg-decor {
      position: fixed;
      pointer-events: none;
      user-select: none;
      z-index: 0;
      opacity: 0.22;
      animation: flotarSuave 8s ease-in-out infinite alternate;
    }
    @keyframes flotarSuave {
      0% { transform: translateY(0px) rotate(0deg); }
      100% { transform: translateY(-25px) rotate(8deg); }
    }

    .bubbly-text {
      text-shadow: 2px 2px 0 #fff, -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 4px 4px 8px rgba(0,0,0,0.5);
    }
    .cat-banner-activa {
      border-color: #facc15 !important;
      box-shadow: 0 0 30px rgba(250, 204, 21, 0.95) !important;
      transform: scale(1.02);
    }
  </style>
</head>
