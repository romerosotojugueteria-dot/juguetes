<!-- SECCIÓN CATEGORÍAS: 2 COLUMNAS (3 Izquierda / 3 Derecha) en formato horizontal grande -->
  <section class="max-w-7xl mx-auto px-4 sm:px-6 py-6 relative z-10">
    <div class="text-center mb-6">
      <h2 class="text-3xl md:text-4xl font-black text-white drop-shadow-md">Explora por Categoría</h2>
      <p class="text-white/90 text-lg font-semibold mt-1">Toca un banner para filtrar</p>
    </div>

    <!-- Contenedor: 1 columna en móviles, 2 columnas amplias a partir de pantalla mediana -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
      
      <!-- COLUMNA IZQUIERDA (3 Banners Horizontales) -->
      <div class="flex flex-col gap-4">
        
        <!-- 1. Todos -->
        <div onclick="filtrarCategoria('todos')" id="card-cat-todos" class="group relative h-32 sm:h-36 rounded-3xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-2xl cat-banner-activa">
          <img id="img-cat-todos" src="https://images.unsplash.com/photo-1558060370-d644479cb6f7?w=1200&auto=format&fit=crop&q=80" alt="Todos" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-black/90 via-black/55 to-transparent flex items-center px-6 sm:px-8">
            <div class="flex items-center gap-5">
              <span class="text-4xl sm:text-5xl filter drop-shadow">✨</span>
              <div>
                <span class="text-white font-black text-2xl sm:text-3xl leading-tight block drop-shadow">Todos</span>
                <span class="text-yellow-300 text-sm sm:text-base font-bold drop-shadow">Ver todo el catálogo</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 2. Niños -->
        <div onclick="filtrarCategoria('ninos')" id="card-cat-ninos" class="group relative h-32 sm:h-36 rounded-3xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-2xl">
          <img id="img-cat-ninos" src="https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=1200&auto=format&fit=crop&q=80" alt="Niños" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-blue-950/90 via-blue-900/55 to-transparent flex items-center px-6 sm:px-8">
            <div class="flex items-center gap-5">
              <span class="text-4xl sm:text-5xl filter drop-shadow">🚀</span>
              <div>
                <span class="text-white font-black text-2xl sm:text-3xl leading-tight block drop-shadow">Niños</span>
                <span class="text-sky-300 text-sm sm:text-base font-bold drop-shadow">Autos, pistas y acción</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 3. Niñas -->
        <div onclick="filtrarCategoria('ninas')" id="card-cat-ninas" class="group relative h-32 sm:h-36 rounded-3xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-2xl">
          <img id="img-cat-ninas" src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=1200&auto=format&fit=crop&q=80" alt="Niñas" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-pink-950/90 via-pink-900/55 to-transparent flex items-center px-6 sm:px-8">
            <div class="flex items-center gap-5">
              <span class="text-4xl sm:text-5xl filter drop-shadow">🦄</span>
              <div>
                <span class="text-white font-black text-2xl sm:text-3xl leading-tight block drop-shadow">Niñas</span>
                <span class="text-pink-300 text-sm sm:text-base font-bold drop-shadow">Muñecas, castillos y magia</span>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- COLUMNA DERECHA (3 Banners Horizontales) -->
      <div class="flex flex-col gap-4">
        
        <!-- 4. Bebés -->
        <div onclick="filtrarCategoria('bebes')" id="card-cat-bebes" class="group relative h-32 sm:h-36 rounded-3xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-2xl">
          <img id="img-cat-bebes" src="https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=1200&auto=format&fit=crop&q=80" alt="Bebés" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-teal-950/90 via-teal-900/55 to-transparent flex items-center px-6 sm:px-8">
            <div class="flex items-center gap-5">
              <span class="text-4xl sm:text-5xl filter drop-shadow">🍼</span>
              <div>
                <span class="text-white font-black text-2xl sm:text-3xl leading-tight block drop-shadow">Bebés</span>
                <span class="text-teal-300 text-sm sm:text-base font-bold drop-shadow">Sonajeros y accesorios</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 5. Didácticos -->
        <div onclick="filtrarCategoria('didacticos')" id="card-cat-didacticos" class="group relative h-32 sm:h-36 rounded-3xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-2xl">
          <img id="img-cat-didacticos" src="https://images.unsplash.com/photo-1587654780291-39c9404d746b?w=1200&auto=format&fit=crop&q=80" alt="Didácticos" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-amber-950/90 via-amber-900/55 to-transparent flex items-center px-6 sm:px-8">
            <div class="flex items-center gap-5">
              <span class="text-4xl sm:text-5xl filter drop-shadow">🧩</span>
              <div>
                <span class="text-white font-black text-2xl sm:text-3xl leading-tight block drop-shadow">Didácticos</span>
                <span class="text-amber-300 text-sm sm:text-base font-bold drop-shadow">Bloques, ingenio y destreza</span>
              </div>
            </div>
          </div>
        </div>

        <!-- 6. Peluches -->
        <div onclick="filtrarCategoria('peluches')" id="card-cat-peluches" class="group relative h-32 sm:h-36 rounded-3xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition-all duration-300 transform hover:-translate-y-1 hover:shadow-2xl">
          <img id="img-cat-peluches" src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=1200&auto=format&fit=crop&q=80" alt="Peluches" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-purple-950/90 via-purple-900/55 to-transparent flex items-center px-6 sm:px-8">
            <div class="flex items-center gap-5">
              <span class="text-4xl sm:text-5xl filter drop-shadow">🧸</span>
              <div>
                <span class="text-white font-black text-2xl sm:text-3xl leading-tight block drop-shadow">Peluches</span>
                <span class="text-purple-300 text-sm sm:text-base font-bold drop-shadow">Suaves y abrazables</span>
              </div>
            </div>
          </div>
        </div>

      </div>

    </div>
  </section>
