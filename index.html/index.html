<!-- SECCIÓN CATEGORÍAS (3 Izquierda / 3 Derecha forzado) -->
  <section class="max-w-7xl mx-auto px-4 py-6 relative z-10">
    <div class="text-center mb-6">
      <h2 class="text-3xl md:text-4xl font-black text-white drop-shadow-md">Explora por Categoría</h2>
      <p class="text-white/90 text-lg font-semibold mt-1">Toca un banner para filtrar</p>
    </div>

    <!-- Contenedor 2 columnas fijas en pantallas medianas hacia arriba -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-5 w-full">
      
      <!-- COLUMNA IZQUIERDA -->
      <div class="flex flex-col gap-4">
        
        <!-- 1. Todos -->
        <div onclick="filtrarCategoria('todos')" id="card-cat-todos" class="group relative rounded-2xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition duration-300 transform hover:-translate-y-1 cat-banner-activa" style="height: 120px;">
          <img id="img-cat-todos" src="https://images.unsplash.com/photo-1558060370-d644479cb6f7?w=1200&auto=format&fit=crop&q=80" alt="Todos" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-black/85 via-black/50 to-transparent flex items-center px-6">
            <span class="text-4xl mr-4">✨</span>
            <div>
              <p class="text-white font-black text-2xl md:text-3xl leading-none">Todos</p>
              <p class="text-yellow-300 text-sm font-bold mt-1">Ver todo el catálogo</p>
            </div>
          </div>
        </div>

        <!-- 2. Niños -->
        <div onclick="filtrarCategoria('ninos')" id="card-cat-ninos" class="group relative rounded-2xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition duration-300 transform hover:-translate-y-1" style="height: 120px;">
          <img id="img-cat-ninos" src="https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=1200&auto=format&fit=crop&q=80" alt="Niños" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-blue-950/85 via-blue-900/50 to-transparent flex items-center px-6">
            <span class="text-4xl mr-4">🚀</span>
            <div>
              <p class="text-white font-black text-2xl md:text-3xl leading-none">Niños</p>
              <p class="text-sky-300 text-sm font-bold mt-1">Autos, pistas y acción</p>
            </div>
          </div>
        </div>

        <!-- 3. Niñas -->
        <div onclick="filtrarCategoria('ninas')" id="card-cat-ninas" class="group relative rounded-2xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition duration-300 transform hover:-translate-y-1" style="height: 120px;">
          <img id="img-cat-ninas" src="https://images.unsplash.com/photo-1516627145497-ae6968895b74?w=1200&auto=format&fit=crop&q=80" alt="Niñas" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-pink-950/85 via-pink-900/50 to-transparent flex items-center px-6">
            <span class="text-4xl mr-4">🦄</span>
            <div>
              <p class="text-white font-black text-2xl md:text-3xl leading-none">Niñas</p>
              <p class="text-pink-300 text-sm font-bold mt-1">Muñecas, castillos y magia</p>
            </div>
          </div>
        </div>

      </div>

      <!-- COLUMNA DERECHA -->
      <div class="flex flex-col gap-4">
        
        <!-- 4. Bebés -->
        <div onclick="filtrarCategoria('bebes')" id="card-cat-bebes" class="group relative rounded-2xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition duration-300 transform hover:-translate-y-1" style="height: 120px;">
          <img id="img-cat-bebes" src="https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=1200&auto=format&fit=crop&q=80" alt="Bebés" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-teal-950/85 via-teal-900/50 to-transparent flex items-center px-6">
            <span class="text-4xl mr-4">🍼</span>
            <div>
              <p class="text-white font-black text-2xl md:text-3xl leading-none">Bebés</p>
              <p class="text-teal-300 text-sm font-bold mt-1">Sonajeros y accesorios</p>
            </div>
          </div>
        </div>

        <!-- 5. Didácticos -->
        <div onclick="filtrarCategoria('didacticos')" id="card-cat-didacticos" class="group relative rounded-2xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition duration-300 transform hover:-translate-y-1" style="height: 120px;">
          <img id="img-cat-didacticos" src="https://images.unsplash.com/photo-1587654780291-39c9404d746b?w=1200&auto=format&fit=crop&q=80" alt="Didácticos" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-amber-950/85 via-amber-900/50 to-transparent flex items-center px-6">
            <span class="text-4xl mr-4">🧩</span>
            <div>
              <p class="text-white font-black text-2xl md:text-3xl leading-none">Didácticos</p>
              <p class="text-amber-300 text-sm font-bold mt-1">Bloques, ingenio y destreza</p>
            </div>
          </div>
        </div>

        <!-- 6. Peluches -->
        <div onclick="filtrarCategoria('peluches')" id="card-cat-peluches" class="group relative rounded-2xl overflow-hidden cursor-pointer border-4 border-white shadow-xl transition duration-300 transform hover:-translate-y-1" style="height: 120px;">
          <img id="img-cat-peluches" src="https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=1200&auto=format&fit=crop&q=80" alt="Peluches" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute inset-0 bg-gradient-to-r from-purple-950/85 via-purple-900/50 to-transparent flex items-center px-6">
            <span class="text-4xl mr-4">🧸</span>
            <div>
              <p class="text-white font-black text-2xl md:text-3xl leading-none">Peluches</p>
              <p class="text-purple-300 text-sm font-bold mt-1">Suaves y abrazables</p>
            </div>
          </div>
        </div>

      </div>

    </div>
  </section>
