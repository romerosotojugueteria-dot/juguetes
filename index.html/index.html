    const firebaseConfig = {

      authDomain: "playup-539e9.firebaseapp.com",
      projectId: "playup-539e9",

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let productos = [];
    let isAdmin = false;
    let categoriaActual = 'todos';
    let presupuestoActual = 'todos';
    
    const productosRef = collection(db, 'juguetes_playup');
    const configRef = doc(db, 'configuracion_playup', 'portada');

    const juguetesPorDefecto = [
      {
        nombre: 'Set de Bloques Castillo Mágico',
        categoria: 'ninas',
        precio: '280',
        descripcion: 'Hermoso castillo armable con luces y figuras pequeñas incluidas.',
        imagenes: [
          'https://placehold.co/600x400/ff99cc/ffffff?text=Castillo+Frente',
          'https://placehold.co/600x400/ff66aa/ffffff?text=Castillo+Atras'
        ]
      },
      {
        nombre: 'Auto de Carreras RC',
        categoria: 'ninos',
        precio: '150',
        descripcion: 'Auto deportivo veloz, recargable, perfecto para exteriores.',
        imagenes: [
          'https://placehold.co/600x400/99ccff/ffffff?text=Auto+Frente',
          'https://placehold.co/600x400/66a3ff/ffffff?text=Auto+Lado'
        ]
      },
      {
        nombre: 'Gimnasio Musical Interactivo',
        categoria: 'bebes',
        precio: '320',
        descripcion: 'Alfombra suave con piano musical y sonajeros para la estimulación.',
        imagenes: [
          'https://placehold.co/600x400/a7f3d0/064e3b?text=Gimnasio+Bebe',
          'https://placehold.co/600x400/6ee7b7/064e3b?text=Gimnasio+Lado'
        ]
      }
    ];

    async function inicializarTienda() {
      try {
        onAuthStateChanged(auth, async (user) => {
          if (user) {
            currentUser = user;
          } else {
            try {
              const cred = await signInAnonymously(auth);
              currentUser = cred.user;
            } catch (authErr) {
              console.error("Error en auth anónima:", authErr);
            }
          }
        });

        let cargaInicial = true;

        onSnapshot(productosRef, async (snapshot) => {
          document.getElementById('loadingIndicator').classList.add('hidden');
          
          let datosNube = [];
          snapshot.forEach(docSnap => {
            datosNube.push({ id: docSnap.id, ...docSnap.data() });
          });

          if (datosNube.length === 0 && cargaInicial) {
            cargaInicial = false;
            for (let jug of juguetesPorDefecto) {
              await addDoc(productosRef, jug);
            }
          } else {
            cargaInicial = false;
            productos = datosNube;
            window.renderProductos();
          }
        }, (error) => {
          console.error("Error sincronizando:", error);
        });

        onSnapshot(configRef, (docSnap) => {
          if (docSnap.exists() && docSnap.data().logoUrl) {
            document.getElementById('logoPrincipal').src = docSnap.data().logoUrl;
          }
        });

      } catch (error) {
        console.error("Error al conectar con tu base de datos:", error);
      }
    }

    inicializarTienda();

    // Compresión súper segura para evitar que la base de datos rechace la foto por tamaño
    function comprimirImagenParaLaNube(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 500; 
            const MAX_HEIGHT = 500;
            let width = img.width; 
            let height = img.height;
            if (width > height) { 
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } 
            } else { 
              if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } 
            }
            canvas.width = width; 
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            // Calidad al 50% para que pese poquísimo y suba al instante
            resolve(canvas.toDataURL('image/jpeg', 0.5));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    window.subirNuevaPortada = async function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const btn = document.getElementById('btnPortada');
      const htmlOriginal = btn.innerHTML;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Subiendo...`;
      btn.disabled = true;

      try {
        const base64 = await comprimirImagenParaLaNube(file);
        await setDoc(configRef, { logoUrl: base64 }, { merge: true });
        alert("¡Portada actualizada con éxito en tu nube! 🎉");
      } catch (error) {
        console.error("Error al subir portada:", error);
        alert("Hubo un error al guardar la portada. Intenta con una imagen más ligera.");
      } finally {
        btn.innerHTML = htmlOriginal;
        btn.disabled = false;
        event.target.value = "";
      }
    }

    window.renderProductos = function() {
      const contenedor = document.getElementById('contenedorProductos');
      contenedor.innerHTML = '';

      const productosFiltrados = productos.filter(p => {
        const pasaCategoria = categoriaActual === 'todos' || p.categoria === categoriaActual;
        
        const precioNum = parseFloat(p.precio);
        let pasaPresupuesto = false;
        
        if (presupuestoActual === 'todos') {
          pasaPresupuesto = true;
        } else if (presupuestoActual === 'rango1') {
          pasaPresupuesto = precioNum >= 30 && precioNum <= 50;
        } else if (presupuestoActual === 'rango2') {
          pasaPresupuesto = precioNum >= 60 && precioNum <= 100;
        } else if (presupuestoActual === 'rango3') {
          pasaPresupuesto = precioNum >= 110 && precioNum <= 160;
        } else if (presupuestoActual === 'rango4') {
          pasaPresupuesto = precioNum >= 170;
        }
        
        return pasaCategoria && pasaPresupuesto;
      });

      if (productosFiltrados.length === 0) {
        contenedor.innerHTML = `
          <div class="col-span-full text-center py-16 bg-white/80 backdrop-blur-md rounded-[40px] border-4 border-dashed border-white shadow-xl">
            <p class="text-4xl font-bold text-purple-500 mb-4">¡Ups! 🙈</p>
            <p class="text-2xl font-bold text-gray-600">Aún no hay juguetes en esta categoría o precio.</p>
          </div>
        `;
        return;
      }

      productosFiltrados.forEach((producto) => {
        const tarjeta = document.createElement('div');
        
        let bgColor = "bg-white/95 border-yellow-300";
        if (producto.categoria === 'bebes') bgColor = "bg-teal-50/95 border-teal-300"; 
        else if (producto.categoria === 'ninos') bgColor = "bg-blue-50/95 border-blue-300"; 
        else if (producto.categoria === 'ninas') bgColor = "bg-pink-50/95 border-pink-300"; 
        else if (producto.categoria === 'didacticos') bgColor = "bg-orange-50/95 border-orange-300"; 
        else if (producto.categoria === 'peluches') bgColor = "bg-purple-50/95 border-purple-300"; 
        
        tarjeta.className = `${bgColor} backdrop-blur-xl border-4 rounded-[40px] overflow-hidden shadow-[0_15px_30px_rgba(0,0,0,0.4)] hover:-translate-y-3 transition duration-300 flex flex-col cursor-pointer group`;
        tarjeta.onclick = () => window.abrirModalVista(producto.id);

        let badgeColor = 'bg-gray-500';
        let badgeText = '✨ Juguete';
        let badgeTextColor = 'text-white';
        
        if (producto.categoria === 'ninos') { badgeColor = 'bg-blue-500'; badgeText = '🚀 Niños'; }
        else if (producto.categoria === 'ninas') { badgeColor = 'bg-pink-500'; badgeText = '🦄 Niñas'; }
        else if (producto.categoria === 'bebes') { badgeColor = 'bg-teal-300'; badgeText = '🍼 Bebé & Accs.'; badgeTextColor = 'text-teal-900'; }
        else if (producto.categoria === 'didacticos') { badgeColor = 'bg-orange-400'; badgeText = '🧩 Didácticos'; }
        else if (producto.categoria === 'peluches') { badgeColor = 'bg-purple-400'; badgeText = '🧸 Peluches'; }

        let adminBotonesHTML = '';
        if (isAdmin) {
          adminBotonesHTML = `
            <div class="flex gap-2 w-full mt-4" onclick="event.stopPropagation()">
              <button onclick="window.abrirModalAdmin('${producto.id}')" class="flex-1 bg-yellow-400 text-yellow-900 py-3 rounded-2xl font-bold hover:bg-yellow-500 transition text-lg border-2 border-white shadow-md">
                <i class="fas fa-edit"></i> Editar
              </button>
              <button onclick="window.eliminarProducto('${producto.id}')" class="flex-1 bg-red-500 text-white py-3 rounded-2xl font-bold hover:bg-red-600 transition text-lg border-2 border-white shadow-md">
                <i class="fas fa-trash"></i> Borrar
              </button>
            </div>
          `;
        }

        tarjeta.innerHTML = `
          <div class="relative h-72 bg-white overflow-hidden p-2">
            <img src="${producto.imagenes[0]}" alt="${producto.nombre}" class="w-full h-full object-cover rounded-[30px] group-hover:scale-105 transition duration-500" />
            <span class="absolute top-5 left-5 ${badgeColor} ${badgeTextColor} text-sm font-bold px-4 py-2 rounded-full shadow-lg uppercase tracking-wider border-2 border-white">
              ${badgeText}
            </span>
            <div class="absolute bottom-5 right-5 bg-black/70 text-white text-sm font-bold px-4 py-2 rounded-full backdrop-blur-sm flex items-center gap-2 border border-white/50">
              <i class="fas fa-search-plus"></i> Detalles
            </div>
          </div>
          <div class="p-8 flex flex-col flex-grow">
            <h3 class="text-3xl font-bold text-purple-900 leading-tight group-hover:text-pink-500 transition">${producto.nombre}</h3>
            <div class="text-4xl font-black text-pink-500 mt-4 drop-shadow-sm">Bs. ${producto.precio}</div>
            ${adminBotonesHTML}
          </div>
        `;
        contenedor.appendChild(tarjeta);
      });
    }

    window.filtrarCategoria = function(cat) {
      categoriaActual = cat;
      const baseClass = "px-8 py-4 rounded-3xl text-2xl font-bold shadow-[0_10px_20px_rgba(0,0,0,0.3)] transition transform hover:scale-105 border-4 border-white ";
      
      document.getElementById('btn-todos').className = baseClass + (cat === 'todos' ? "bg-yellow-400 text-purple-900 scale-105" : "bg-white/20 text-white backdrop-blur-md");
      document.getElementById('btn-ninos').className = baseClass + (cat === 'ninos' ? "bg-blue-500 text-white scale-105" : "bg-white/20 text-white backdrop-blur-md");
      document.getElementById('btn-ninas').className = baseClass + (cat === 'ninas' ? "bg-pink-500 text-white scale-105" : "bg-white/20 text-white backdrop-blur-md");
      document.getElementById('btn-bebes').className = baseClass + (cat === 'bebes' ? "bg-teal-300 text-teal-900 scale-105" : "bg-white/20 text-white backdrop-blur-md");
      document.getElementById('btn-didacticos').className = baseClass + (cat === 'didacticos' ? "bg-orange-400 text-white scale-105" : "bg-white/20 text-white backdrop-blur-md");
      document.getElementById('btn-peluches').className = baseClass + (cat === 'peluches' ? "bg-purple-400 text-white scale-105" : "bg-white/20 text-white backdrop-blur-md");

      window.renderProductos();
    }

    window.filtrarPresupuesto = function(rango) {
      presupuestoActual = rango;
      const botones = ['todos', 'rango1', 'rango2', 'rango3', 'rango4'];
      const baseClass = "px-5 py-2 rounded-full text-lg font-bold border-2 border-white shadow-md transform hover:scale-105 transition ";
      
      botones.forEach(valor => {
        const btn = document.getElementById(`btn-precio-${valor}`);
        if(btn) {
          if(valor === rango) {
            btn.className = baseClass + "bg-green-500 text-white scale-105"; 
          } else {
            btn.className = baseClass + "bg-white/30 text-white hover:bg-white/60"; 
          }
        }
      });
      window.renderProductos();
    }

    window.loginAdmin = function() {
      if(isAdmin) {
        alert("Ya estás en el modo Administrador.");
        return;
      }
      const pass = prompt('Ingresa la contraseña de administrador:');
      if (pass === 'mariaPlayup') {
        isAdmin = true;
        document.getElementById('adminPanel').classList.remove('hidden');
        document.getElementById('btnAdminLogin').classList.add('hidden');
        window.renderProductos();
        alert('¡Bienvenida, María! Modo administradora activado.');
      } else if (pass !== null) {
        alert('Contraseña incorrecta.');
      }
    }

    let productoActualModal = null;
    let anguloActualIndex = 0;
    const modalVista = document.getElementById('modalVista');
    const modalVistaContent = document.getElementById('modalVistaContent');

    window.abrirModalVista = function(id) {
      const prod = productos.find(p => p.id === id);
      if(!prod) return;
      productoActualModal = prod;
      anguloActualIndex = 0;

      document.getElementById('detalleNombre').innerText = prod.nombre;
      document.getElementById('detalleDescripcion').innerText = prod.descripcion;
      document.getElementById('detallePrecio').innerText = `Bs. ${prod.precio}`;
      
      const badge = document.getElementById('detalleCategoriaBadge');
      if(prod.categoria === 'ninos') { badge.className = "px-6 py-2 rounded-full text-lg font-bold uppercase tracking-wider text-white shadow-md bg-blue-500 border-2 border-white"; badge.innerText = "🚀 Juguete de Niños"; } 
      else if (prod.categoria === 'ninas') { badge.className = "px-6 py-2 rounded-full text-lg font-bold uppercase tracking-wider text-white shadow-md bg-pink-500 border-2 border-white"; badge.innerText = "🦄 Juguete de Niñas"; } 
      else if (prod.categoria === 'bebes') { badge.className = "px-6 py-2 rounded-full text-lg font-bold uppercase tracking-wider text-teal-900 shadow-md bg-teal-300 border-2 border-white"; badge.innerText = "🍼 Bebés y Accesorios"; } 
      else if (prod.categoria === 'didacticos') { badge.className = "px-6 py-2 rounded-full text-lg font-bold uppercase tracking-wider text-white shadow-md bg-orange-400 border-2 border-white"; badge.innerText = "🧩 Juguete Didáctico"; } 
      else if (prod.categoria === 'peluches') { badge.className = "px-6 py-2 rounded-full text-lg font-bold uppercase tracking-wider text-white shadow-md bg-purple-400 border-2 border-white"; badge.innerText = "🧸 Peluche"; }

      const mensajeWa = `Buen dia me gustaria saber cuanto esta este juguete automatico: *${prod.nombre}* a Bs. ${prod.precio}`;
      document.getElementById('detalleBtnWhatsApp').href = `https://wa.me/qr/RQIEHSOPT7CCD1?text=${encodeURIComponent(mensajeWa)}`;

      document.getElementById('imgThumb0').src = prod.imagenes[0];
      document.getElementById('imgThumb1').src = prod.imagenes[1] || prod.imagenes[0];

      window.actualizarAnguloVisual();

      modalVista.classList.remove('hidden');
      modalVista.classList.add('flex');
      setTimeout(() => { modalVista.classList.remove('opacity-0'); modalVistaContent.classList.remove('scale-95'); }, 10);
    }

    window.cambiarAngulo = function(index) {
      if(!productoActualModal) return;
      anguloActualIndex = index;
      window.actualizarAnguloVisual();
    }

    window.actualizarAnguloVisual = function() {
      if(!productoActualModal) return;
      document.getElementById('imagenPrincipal').src = productoActualModal.imagenes[anguloActualIndex] || productoActualModal.imagenes[0];
      const thumb0 = document.getElementById('thumb0');
      const thumb1 = document.getElementById('thumb1');
      const baseThumbClass = "w-24 h-24 rounded-2xl overflow-hidden shadow-lg focus:outline-none transition hover:scale-105 bg-white border-4 ";
      if(anguloActualIndex === 0) {
        thumb0.className = baseThumbClass + "border-pink-500 scale-105";
        thumb1.className = baseThumbClass + "border-transparent opacity-60";
      } else {
        thumb0.className = baseThumbClass + "border-transparent opacity-60";
        thumb1.className = baseThumbClass + "border-pink-500 scale-105";
      }
    }

    window.cerrarModalVista = function() {
      modalVista.classList.add('opacity-0');
      modalVistaContent.classList.add('scale-95');
      setTimeout(() => { modalVista.classList.add('hidden'); modalVista.classList.remove('flex'); }, 300);
    }

    const modalAdminForm = document.getElementById('modalAdminForm');
    const modalAdminContent = document.getElementById('modalAdminContent');
    const formProducto = document.getElementById('formProducto');

    window.abrirModalAdmin = function(id = null) {
      modalAdminForm.classList.remove('hidden');
      modalAdminForm.classList.add('flex');
      setTimeout(() => { modalAdminForm.classList.remove('opacity-0'); modalAdminContent.classList.remove('scale-95'); }, 10);

      formProducto.reset();
      document.getElementById('productoId').value = '';

      if(id) {
        document.getElementById('modalAdminTitulo').innerText = '✏️ Editar Juguete';
        const prod = productos.find(p => p.id === id);
        if(prod) {
          document.getElementById('productoId').value = prod.id;
          document.getElementById('productoNombre').value = prod.nombre;
          document.getElementById('productoCategoria').value = prod.categoria;
          document.getElementById('productoPrecio').value = prod.precio;
          document.getElementById('productoDescripcion').value = prod.descripcion;
        }
      } else {
        document.getElementById('modalAdminTitulo').innerText = '✨ Añadir Nuevo Juguete';
      }
    }

    window.cerrarModalAdmin = function() {
      modalAdminForm.classList.add('opacity-0');
      modalAdminContent.classList.add('scale-95');
      setTimeout(() => { modalAdminForm.classList.add('hidden'); modalAdminForm.classList.remove('flex'); }, 300);
    }

    window.guardarProducto = async function(event) {
      event.preventDefault();

      const btnGuardar = document.getElementById('btnGuardarProd');
      btnGuardar.disabled = true;
      btnGuardar.innerText = "⏳ Guardando en la nube...";

      try {
        const idActual = document.getElementById('productoId').value;
        const nombre = document.getElementById('productoNombre').value;
        const categoria = document.getElementById('productoCategoria').value;
        const precio = document.getElementById('productoPrecio').value;
        const descripcion = document.getElementById('productoDescripcion').value;

        const file1 = document.getElementById('productoImagen1').files[0];
        const file2 = document.getElementById('productoImagen2').files[0];

        let img1Base64 = null; let img2Base64 = null;
        if (file1) img1Base64 = await comprimirImagenParaLaNube(file1);
        if (file2) img2Base64 = await comprimirImagenParaLaNube(file2);

        if (idActual) {
          const docRef = doc(db, 'juguetes_playup', idActual);
          const prodActual = productos.find(p => p.id === idActual);
          const updateData = { nombre, categoria, precio, descripcion, imagenes: [...prodActual.imagenes] };
          
          if (img1Base64) updateData.imagenes[0] = img1Base64;
          if (img2Base64) updateData.imagenes[1] = img2Base64;

          await updateDoc(docRef, updateData);
        } else {
          const nuevoProd = {
            nombre, categoria, precio, descripcion,
            imagenes: [
              img1Base64 || `https://placehold.co/600x400/eeeeee/666666?text=${encodeURIComponent(nombre)}+1`,
              img2Base64 || `https://placehold.co/600x400/dddddd/555555?text=${encodeURIComponent(nombre)}+2`
            ]
          };
          await addDoc(productosRef, nuevoProd);
        }

        window.cerrarModalAdmin();
      } catch (error) {
        console.error("Error al guardar:", error);
        alert("Ocurrió un error guardando el juguete. Intenta con fotos un poco más pequeñas.");
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.innerText = "Guardar Juguete";
      }
    }

    window.eliminarProducto = async function(id) {
      if(confirm('🚨 ¿Estás segura de eliminar este juguete permanentemente?')) {
        try {
          const docRef = doc(db, 'juguetes_playup', id);
          await deleteDoc(docRef);
        } catch (error) {
          console.error("Error al eliminar", error);
        }
      }
    }

    window.filtrarCategoria('todos');
  </script>
</body>
</html>
