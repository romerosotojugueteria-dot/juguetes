<!-- Modal Registro de Clientes (10 Preguntas de la Guía) -->
  <div id="modalRegistro" class="fixed inset-0 bg-black/80 backdrop-blur-md hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-300">
    <div class="bg-white rounded-[40px] p-6 md:p-8 w-full max-w-2xl shadow-2xl border-4 border-yellow-400 relative max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4 sticky top-0 bg-white/95 backdrop-blur-sm pb-2 z-10 border-b border-purple-100">
        <div>
          <h3 class="text-2xl md:text-3xl font-black text-purple-900 flex items-center gap-2">
            🎁 Registro de Amigos PlayUp
          </h3>
          <p class="text-sm font-semibold text-gray-600 mt-1">Completa tus datos para recibir novedades, promociones y sorpresas.</p>
        </div>
        <button type="button" onclick="cerrarModalRegistro()" class="text-gray-400 hover:text-red-500 text-3xl">
          <i class="fas fa-times-circle"></i>
        </button>
      </div>

      <form id="formRegistroCliente" onsubmit="enviarRegistroCliente(event)" class="space-y-4">
        
        <!-- 1. Nombre completo -->
        <div>
          <label class="block text-gray-700 font-bold mb-1 ml-1 text-sm">1. Nombre completo *</label>
          <input type="text" id="regNombre" required placeholder="Ej: Mariana Rodríguez" class="w-full bg-purple-50 border-2 border-purple-200 focus:border-purple-500 rounded-2xl px-4 py-2.5 font-semibold text-base outline-none">
        </div>

        <!-- 2. Correo electrónico -->
        <div>
          <label class="block text-gray-700 font-bold mb-1 ml-1 text-sm">2. Correo electrónico *</label>
          <input type="email" id="regCorreo" required placeholder="nombre@correo.com" class="w-full bg-purple-50 border-2 border-purple-200 focus:border-purple-500 rounded-2xl px-4 py-2.5 font-semibold text-base outline-none">
        </div>

        <!-- 3. Número de teléfono -->
        <div>
          <label class="block text-gray-700 font-bold mb-1 ml-1 text-sm">3. Número de teléfono *</label>
          <input type="tel" id="regTelefono" required placeholder="+591 78564321" class="w-full bg-purple-50 border-2 border-purple-200 focus:border-purple-500 rounded-2xl px-4 py-2.5 font-semibold text-base outline-none">
        </div>

        <!-- 4. Dirección -->
        <div>
          <label class="block text-gray-700 font-bold mb-1 ml-1 text-sm">4. Dirección (ciudad, zona, calle, número)</label>
          <input type="text" id="regDireccion" placeholder="Ej: Zona Los Pozos, Calle Suárez #244" class="w-full bg-purple-50 border-2 border-purple-200 focus:border-purple-500 rounded-2xl px-4 py-2.5 font-semibold text-base outline-none">
        </div>

        <!-- 5. Ciudad donde vive -->
        <div>
          <label class="block text-gray-700 font-bold mb-1 ml-1 text-sm">5. Ciudad donde vive *</label>
          <select id="regCiudad" required class="w-full bg-purple-50 border-2 border-purple-200 focus:border-purple-500 rounded-2xl px-4 py-2.5 font-semibold text-base outline-none">
            <option value="">Selecciona tu ciudad...</option>
            <option value="Santa Cruz de la Sierra">Santa Cruz de la Sierra</option>
            <option value="La Paz">La Paz</option>
            <option value="Cochabamba">Cochabamba</option>
            <option value="El Alto">El Alto</option>
            <option value="Sucre">Sucre</option>
            <option value="Oruro">Oruro</option>
            <option value="Tarija">Tarija</option>
            <option value="Potosí">Potosí</option>
            <option value="Trinidad">Trinidad</option>
            <option value="Cobija">Cobija</option>
            <option value="Otra">Otra</option>
          </select>
        </div>

        <!-- 6. Fecha de nacimiento -->
        <div>
          <label class="block text-gray-700 font-bold mb-1 ml-1 text-sm">6. Fecha de nacimiento *</label>
          <input type="date" id="regFechaNac" required class="w-full bg-purple-50 border-2 border-purple-200 focus:border-purple-500 rounded-2xl px-4 py-2.5 font-semibold text-base outline-none text-gray-700">
        </div>

        <!-- 7. Servicio o producto de interés (Específico: Juguetería) + Campo extra: Edad -->
        <div class="bg-purple-50/70 p-4 rounded-2xl border-2 border-purple-200">
          <label class="block text-purple-900 font-black mb-2 text-sm">7. ¿Qué juguetes o productos te interesan? (Selecciona una o varias opciones) *</label>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm font-semibold text-gray-700 mb-3">
            <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-xl border border-purple-100">
              <input type="checkbox" name="interes" value="Juguetes didácticos" class="accent-purple-600 w-4 h-4"> Juguetes didácticos
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-xl border border-purple-100">
              <input type="checkbox" name="interes" value="Muñecas y figuras" class="accent-purple-600 w-4 h-4"> Muñecas y figuras
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-xl border border-purple-100">
              <input type="checkbox" name="interes" value="Autos y vehículos" class="accent-purple-600 w-4 h-4"> Autos y vehículos
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-xl border border-purple-100">
              <input type="checkbox" name="interes" value="Juegos de mesa" class="accent-purple-600 w-4 h-4"> Juegos de mesa
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-xl border border-purple-100">
              <input type="checkbox" name="interes" value="Peluches" class="accent-purple-600 w-4 h-4"> Peluches
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-white p-2 rounded-xl border border-purple-100">
              <input type="checkbox" name="interes" value="Videojuegos" class="accent-purple-600 w-4 h-4"> Videojuegos
            </label>
          </div>
          <label class="block text-gray-700 font-bold mb-1 text-xs">Edad del niño o niña (campo sugerido):</label>
          <input type="text" id="regEdadPeques" placeholder="Ej: 3 y 6 años" class="w-full bg-white border border-purple-200 rounded-xl px-3 py-2 text-sm outline-none">
        </div>

        <!-- 8. Cómo prefiere que lo contactemos -->
        <div>
          <label class="block text-gray-700 font-bold mb-2 ml-1 text-sm">8. ¿Cómo prefieres que te contactemos? *</label>
          <div class="flex flex-wrap gap-4 text-sm font-semibold text-gray-700">
            <label class="flex items-center gap-2 cursor-pointer bg-purple-50 px-3 py-2 rounded-xl border border-purple-200">
              <input type="radio" name="contactoPref" value="WhatsApp" checked class="accent-purple-600 w-4 h-4"> WhatsApp
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-purple-50 px-3 py-2 rounded-xl border border-purple-200">
              <input type="radio" name="contactoPref" value="Correo" class="accent-purple-600 w-4 h-4"> Correo
            </label>
            <label class="flex items-center gap-2 cursor-pointer bg-purple-50 px-3 py-2 rounded-xl border border-purple-200">
              <input type="radio" name="contactoPref" value="Teléfono" class="accent-purple-600 w-4 h-4"> Teléfono
            </label>
          </div>
        </div>

        <!-- 9. Comentario o consulta -->
        <div>
          <label class="block text-gray-700 font-bold mb-1 ml-1 text-sm">9. Comentario o consulta (opcional)</label>
          <textarea id="regComentario" rows="2" placeholder="¿Buscas algún juguete en particular o tienes alguna duda?" class="w-full bg-purple-50 border-2 border-purple-200 focus:border-purple-500 rounded-2xl px-4 py-2.5 font-semibold text-sm outline-none resize-none"></textarea>
        </div>

        <!-- 10. Acepta términos y política de privacidad -->
        <div class="pt-2">
          <label class="flex items-start gap-2 cursor-pointer text-xs font-semibold text-gray-700">
            <input type="checkbox" id="regAcepta" required class="accent-purple-600 w-4 h-4 mt-0.5">
            <span>Acepto los <a href="#" class="text-purple-600 underline">términos y condiciones</a> y la <a href="#" class="text-purple-600 underline">política de privacidad</a> *</span>
          </label>
        </div>

        <button type="submit" id="btnEnviarRegistro" class="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-purple-950 text-xl font-black py-3.5 rounded-3xl hover:opacity-95 transition shadow-xl mt-3 border-2 border-white flex items-center justify-center gap-2">
          <span>¡Registrarme y Ganar Sorpresa!</span> 🚀
        </button>
      </form>
    </div>
  </div>
